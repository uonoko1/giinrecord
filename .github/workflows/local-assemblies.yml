name: ETL local assemblies (monthly)
# 地方議会（宮城県議会 pref-04 #157、徳島県議会 pref-36 #183、鳥取県議会 pref-31 #184、奈良県議会 pref-29 #202）の名簿と議員別表決の月次 ETL。議会は ASSEMBLIES に 1 行ずつ足す。議会は会期（定例会）単位で更新されるので月 1 回で足りる。
# data PR の流れは districts.yml / 日次 etl.yml と同じ（docs/ops/etl.md）。ブランチ名と失敗 Issue のタイトルだけ別。
on:
  schedule:
    - cron: "0 20 4 * *"   # 05:00 JST on the 5th of every month（districts.yml の 2 日とずらす）
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write        # failure → auto Issue
  actions: write       # gh workflow run deploy-data.yml / approve pending runs
concurrency:
  group: etl           # 日次 ETL と直列化（同時に data PR を作らない）
  cancel-in-progress: false
env:
  DATA_BRANCH: data/local-assemblies
  # `pnpm etl:local <name>` の name と assemblyId（name=id の組。順に直列で走らせる）
  ASSEMBLIES: "miyagi=pref-04 tokushima=pref-36 tottori=pref-31 nara=pref-29"
  FAILURE_ISSUE_TITLE: "地方議会 ETL 月次実行が失敗した（local-assemblies.yml）"
jobs:
  local-assemblies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 日次 ETL と同じイメージ（packages/etl/Dockerfile）。ENTRYPOINT だけ local-cli.ts に差し替える。
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/etl/Dockerfile
          push: false
          load: true
          tags: gikailog-etl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 名簿・会期 index・会期ページ（HTML）は毎回取得、表決 PDF（URL 固定）は実行中だけキャッシュする（月次なのでキャッシュの復元はしない）。
      # 取得は県の公式ホストだけ・UA 明記・1 秒以上間隔・robots.txt 遵守（packages/etl/src/sources/local/polite-fetch.ts）。
      # `shell: bash` で pipefail を効かせる（ETL の非0終了が tee に隠れないように。packages/etl/test/workflow-local-assemblies.test.ts）。
      - name: Run local assemblies ETL
        shell: bash
        run: |
          mkdir -p packages/etl/.cache
          for pair in $ASSEMBLIES; do
            name="${pair%%=*}"
            echo "### $name (${pair#*=})" | tee -a etl.log
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD/data:/app/data" -v "$PWD/packages/etl/.cache:/app/packages/etl/.cache" \
              --entrypoint node gikailog-etl:ci --import tsx src/local-cli.ts "$name" 2>&1 | tee -a etl.log
          done

      - name: Open / update data PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gikailog-etl[bot]"
          git config user.email "etl@users.noreply.github.com"
          git add data
          CHANGED=$(git diff --cached --name-only | wc -l | tr -d ' ')
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "0" ]; then echo "no data changes"; echo "number=" >> "$GITHUB_OUTPUT"; exit 0; fi
          STAMP=$(date -u +%Y-%m-%dT%H:%MZ)
          git switch -c "$DATA_BRANCH"
          git commit -m "data: local assemblies $STAMP"
          # 既存ブランチへの force-push は GITHUB_TOKEN（workflows 権限なし）が拒否することがあるので、削除して新規 push する（etl.yml と同じ）。
          git push origin --delete "$DATA_BRANCH" 2>/dev/null || true
          git push origin "$DATA_BRANCH"
          NUMBER=$(gh pr list --head "$DATA_BRANCH" --state open --json number -q ".[0].number")
          if [ -z "$NUMBER" ]; then
            gh pr create --base main --head "$DATA_BRANCH" --title "data: local assemblies $STAMP" \
              --body "Automated local assemblies ETL output (宮城県議会 pref-04・徳島県議会 pref-36: 名簿 × 各議員の表決 PDF → data/members/ の地方議員と data/assemblies/{id}/). Validated by validateLocalAssemblies in the ETL run. 不明セル（推定せず残した数）と名寄せできなかった氏名は data/assemblies/{id}/meta.json・unmatched.json." --label etl
            NUMBER=$(gh pr list --head "$DATA_BRANCH" --state open --json number -q ".[0].number")
          fi
          test -n "$NUMBER"   # PR が無ければここで失敗させる（サイレント失敗対策）
          echo "data PR #$NUMBER"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          gh pr merge "$NUMBER" --squash --auto

      - name: Job summary
        if: always()
        env:
          PR: ${{ steps.pr.outputs.number }}
          CHANGED: ${{ steps.pr.outputs.changed }}
          STATUS: ${{ job.status }}
        run: |
          field() { node -e 'const m=JSON.parse(require("fs").readFileSync("data/assemblies/"+process.argv[2]+"/meta.json","utf8"));console.log(process.argv[1].split(".").reduce((o,k)=>o?.[k],m)??"?")' "$1" "$2" 2>/dev/null || echo "?"; }
          if [ -n "$PR" ]; then PR_CELL="#$PR"; else PR_CELL="なし（data/ に変更なし）"; fi
          {
            echo "## ETL local assemblies（$ASSEMBLIES）"
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| 結果 | $STATUS |"
            echo "| データ PR | $PR_CELL |"
            echo "| 変更ファイル数 | ${CHANGED:-?} |"
            echo
            echo "| 議会 | 名簿の as-of | 議員 | 表決（議案） | セル（議員数×議案数） | 不明セル（推定せず「不明」にした数） | 名簿に寄せられなかった氏名（unmatched.json） |"
            echo "|---|---|---|---|---|---|---|"
            for pair in $ASSEMBLIES; do
              id="${pair#*=}"
              echo "| $id | $(field rosterAsOf "$id") | $(field counts.members "$id") | $(field counts.rollcalls "$id") | $(field counts.cells "$id") | $(field counts.unknownCells "$id") | $(field counts.unmatchedNames "$id") |"
            done
            echo
            echo "<details><summary>ETL ログ</summary>"
            echo
            echo '```'
            cat etl.log 2>/dev/null || echo "(none)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # auto-merge は Deploy を起動しない（GITHUB_TOKEN のマージは push イベントを起こさない）ので、マージを待って deploy-data.yml を起動する（etl.yml と同じ）。
      - name: Wait for data PR merge, then deploy
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          for i in $(seq 1 45); do   # 45 × 20s = 15 min
            STATE=$(gh pr view "$PR" --json state -q .state)
            echo "[$i] PR #$PR state=$STATE"
            case "$STATE" in
              MERGED) gh workflow run deploy-data.yml --ref main; echo "deploy-data.yml を起動した（staging + production）" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              CLOSED) echo "PR #$PR はマージされずに閉じられた" >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            esac
            if [ "$(gh pr view "$PR" --json mergeStateStatus -q .mergeStateStatus)" = "BEHIND" ]; then
              echo "PR #$PR is BEHIND main; updating branch"
              gh pr update-branch "$PR" || true
            fi
            for RUN in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$DATA_BRANCH&status=action_required" -q '.workflow_runs[].id'); do
              echo "approving run $RUN"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/approve" || true
            done
            sleep 20
          done
          echo "PR #$PR が 15 分以内にマージされなかった（required check が走っていない／失敗？）" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Open failure Issue (deduped by title)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.FAILURE_ISSUE_TITLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", labels: "etl", per_page: 100 });
            const dup = open.find((i) => i.title === title && !i.pull_request);
            if (dup) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: dup.number, body: `再度失敗: ${runUrl}` });
              core.info(`commented on existing #${dup.number}`);
              return;
            }
            const { data } = await github.rest.issues.create({
              ...context.repo, title, labels: ["etl", "infra"],
              body: [
                "地方議会 ETL ワークフロー（月次、宮城県議会・徳島県議会）が失敗しました。",
                "",
                `- 実行: ${runUrl}`,
                "- 手順と失敗モード: docs/ops/etl.md（地方議会 ETL の節）",
                "- 出典と契約: docs/DATA_CONTRACT.md（地方議会）、docs/research/local-assemblies.md",
                "",
                "原因（名簿ページ・会期 index・表決 PDF のレイアウト変化、凡例に無い値など）を直したら Issue を閉じてください。",
              ].join("\n"),
            });
            core.info(`created #${data.number}`);
