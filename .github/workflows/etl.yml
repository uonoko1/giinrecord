name: ETL (daily)
on:
  schedule:
    - cron: "0 21 * * *"   # 06:00 JST
  workflow_dispatch:
    inputs:
      sessions:
        description: "Diet session numbers (space separated). Empty = current."
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write
jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm etl ${{ github.event.inputs.sessions }}
      - name: Commit data changes
        run: |
          git config user.name "seiji-kiroku-etl[bot]"
          git config user.email "etl@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
