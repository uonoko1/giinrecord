name: ETL (daily)
on:
  schedule:
    - cron: "0 21 * * *"   # 06:00 JST
  workflow_dispatch:
    inputs:
      sessions:
        description: "Diet session numbers (space separated). Empty = current."
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write
jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm etl ${{ github.event.inputs.sessions }}
      - name: Open / update data PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "seiji-kiroku-etl[bot]"
          git config user.email "etl@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          STAMP=$(date -u +%Y-%m-%dT%H:%MZ)
          git switch -c data/refresh
          git commit -m "data: refresh $STAMP"
          git push --force origin data/refresh
          if ! gh pr view data/refresh --json number >/dev/null 2>&1; then
            gh pr create --base main --head data/refresh --title "data: refresh $STAMP" \
              --body "Automated ETL output. Validated by validateDataset in the ETL run; CI builds the site with it." --label etl
          fi
          gh pr merge data/refresh --squash --auto
