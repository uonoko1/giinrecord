name: ETL (daily)
on:
  schedule:
    - cron: "0 21 * * *"   # 06:00 JST
  workflow_dispatch:
    inputs:
      sessions:
        description: "Diet session numbers (space separated). Empty = current."
        required: false
        default: ""
      rebuild:
        # 名寄せを厳格化したあとの作り直し（docs/ops/etl.md「#230」）。既定は空で、cron 実行にも
        # sessions だけの手動実行にも入らない。"yes" と打ったときだけ発火する（boolean や choice の
        # 既定値でうっかり入る形にしない）。中身は scripts/ci/etl-rebuild-prepare.sh。
        description: 'Rebuild: 国会側の data/ を消してから流す。"yes" のときだけ。sessions に全22回次が必要'
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write
  issues: write        # failure → auto Issue
  actions: write       # gh workflow run deploy-data.yml / approve pending runs
concurrency:
  group: etl-daily     # ワークフロー固有（#201）。group を共有すると待機中の run がキャンセルされる（バックフィルが月次に殺された）。データ PR ブランチが別なので月次とは並走できる。Deploy の直列化は deploy-site.yml の deploy-vps group が担う（#308: rrsync のロックは制限ルート全体に掛かるので dir ごとでは足りない）。
  cancel-in-progress: false
env:
  DATA_BRANCH: data/refresh
  FAILURE_ISSUE_TITLE: "ETL 日次実行が失敗した（etl.yml）"
jobs:
  etl:
    runs-on: ubuntu-latest
    # **GitHub ホステッドランナーのジョブ上限は 6 時間（360分）で、timeout-minutes では超えられない**
    # （480 を指定した run 32890265206 がきっかり 360 分で cancelled になった）。
    # 作り直しは実測 359 分で上限に張り付くので **1 回では完走できない前提**で運用する。
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # ETL はコンテナで動かす（#86）。ローカルの `docker compose -f deploy/docker-compose.etl.yml run --rm etl` と同じイメージ。
      # GHCR には push しない。レイヤーキャッシュだけ GitHub Actions cache に置く。
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/etl/Dockerfile
          push: false
          load: true
          tags: giinrecord-etl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 取得済み HTML のキャッシュ。キーは日付なので毎日新しいエントリが保存され、restore-keys で前日分から復元する。
      # 回次一覧 vote_ind.htm・議員名簿・議案ページ・会議録 API は ETL 側が noCache で毎回取得する（packages/etl/src/fetch.ts）。
      - id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: packages/etl/.cache
          key: etl-cache-${{ steps.date.outputs.today }}
          restore-keys: etl-cache-

      # `shell: bash` を明示すると `bash -eo pipefail` になる（既定の `bash -e {0}` は pipefail なしで、
      # ETL の非0終了が tee の exit 0 に隠れてデータ PR まで進んでしまう）。
      # data/ と .cache は bind mount。runner の uid で動かすので、書かれたファイルはそのまま git add / cache save できる。
      # .cache は restore が空振りしたときに docker が root で作らないよう先に mkdir する。
      # rebuild を明示したときだけ国会側の data/ を消す（#284）。既定（cron / sessions だけの手動実行）は
      # 何も消さずに exit 0 する。回次が全22回次に足りなければ、消す前に非0終了する
      # （消してから既定の5回次だけ流すと残り17回次を引き継ぐ元が無くなる）。
      # 検証は scripts/ci/test/etl-rebuild-prepare.test.sh（CI の bash tests で毎回走る）。
      - name: Wipe Diet data (rebuild only)
        shell: bash
        env:
          REBUILD: ${{ github.event.inputs.rebuild }}
          SESSIONS: ${{ github.event.inputs.sessions }}
        run: bash scripts/ci/etl-rebuild-prepare.sh "$REBUILD" "$SESSIONS"

      # ステップ単位の timeout を job（360分＝GitHub の上限）より短く置く。job の timeout に当たると
      # **後続ステップごと打ち切られ、if: always() の cache/save にも到達しない**
      # （2026-08-25 の run 32853869643 が実際にそうなり、359分ぶんの取得が丸ごと失われた）。
      # ここで先に打ち切れば、取得済みページを .cache に保存してから終われる。
      - name: Run ETL
        timeout-minutes: 330
        shell: bash
        env:
          SESSIONS: ${{ github.event.inputs.sessions || '217 218 219 220 221' }}
          # 作り直し（#294）のときだけ、**最新回次より古い回次**の取得を .cache から読む。
          # 日次 cron・sessions だけの手動実行では rebuild が空なので '' になり、無効のまま
          # （fetch.ts の cacheClosedSessionsEnabled は "1" のときだけ true）。
          # 日次 ETL の鮮度の振る舞いを変えないことがこの分岐の目的である。
          ETL_CACHE_CLOSED_SESSIONS: ${{ github.event.inputs.rebuild == 'yes' && '1' || '' }}
        run: |
          mkdir -p packages/etl/.cache
          # shellcheck disable=SC2086  # SESSIONS は空白区切りの回次リスト
          docker run --rm --user "$(id -u):$(id -g)" \
            -e ETL_CACHE_CLOSED_SESSIONS \
            -v "$PWD/data:/app/data" -v "$PWD/packages/etl/.cache:/app/packages/etl/.cache" \
            giinrecord-etl:ci $SESSIONS 2>&1 | tee etl.log

      # 失敗しても取得済みページは次回に活かす（job が失敗すると actions/cache の自動保存は走らない）。
      # key は run ごとに一意にする。**同じ key が既にあると actions/cache/save は黙って
      # スキップし、ステップは success と表示される**（run 32919656778 の 6 時間ぶんが
      # これで失われ、キャッシュは 93MB のまま増えなかった）。
      # restore 側は restore-keys: etl-cache- の前方一致なので、次の run は最新から始まる。
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: packages/etl/.cache
          key: etl-cache-${{ steps.date.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Open / update data PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "giinrecord-etl[bot]"
          git config user.email "etl@users.noreply.github.com"
          git add data
          CHANGED=$(git diff --cached --name-only | wc -l | tr -d ' ')
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "0" ]; then echo "no data changes"; echo "number=" >> "$GITHUB_OUTPUT"; exit 0; fi
          STAMP=$(date -u +%Y-%m-%dT%H:%MZ)
          git switch -c "$DATA_BRANCH"
          git commit -m "data: refresh $STAMP"
          # 既存ブランチへの force-push は main 側で進んだ .github/ の差分を含み、GITHUB_TOKEN（workflows 権限なし）が拒否する。
          # リモートを削除して新規ブランチとして push する（新規コミットは data/ のみ）。
          git push origin --delete "$DATA_BRANCH" 2>/dev/null || true
          git push origin "$DATA_BRANCH"
          NUMBER=$(gh pr list --head "$DATA_BRANCH" --state open --json number -q ".[0].number")
          if [ -z "$NUMBER" ]; then
            gh pr create --base main --head "$DATA_BRANCH" --title "data: refresh $STAMP" \
              --body "Automated ETL output. Validated by validateDataset in the ETL run; CI builds the site with it." --label etl
            NUMBER=$(gh pr list --head "$DATA_BRANCH" --state open --json number -q ".[0].number")
          fi
          test -n "$NUMBER"   # PR が無ければここで失敗させる（サイレント失敗対策）
          echo "data PR #$NUMBER"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          gh pr merge "$NUMBER" --squash --auto

      # bot 周りは「成功したように見えて何も起きない」失敗が多いので、結果を必ず可視化する（docs/sprints/sprint-2.md）。
      - name: Job summary
        if: always()
        env:
          PR: ${{ steps.pr.outputs.number }}
          CHANGED: ${{ steps.pr.outputs.changed }}
          STATUS: ${{ job.status }}
          REBUILD: ${{ github.event.inputs.rebuild }}
        run: |
          count() { node -e 'const a=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(Array.isArray(a)?a.length:"?")' "$1" 2>/dev/null || echo "?"; }
          # 未突合は回次別に分かれている（#219）。unmatched.json（回次の引けない行）と unmatched/*.json の合計を数える
          count_unmatched() { node -e 'const fs=require("fs"),p=require("path");const n=(f)=>{try{const a=JSON.parse(fs.readFileSync(f,"utf8"));return Array.isArray(a)?a.length:0}catch{return 0}};let t=n("data/unmatched.json");try{for(const f of fs.readdirSync("data/unmatched"))if(f.endsWith(".json"))t+=n(p.join("data/unmatched",f))}catch{}console.log(t)' 2>/dev/null || echo "?"; }
          if [ -n "$PR" ]; then PR_CELL="#$PR"; else PR_CELL="なし（data/ に変更なし）"; fi
          {
            echo "## ETL"
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| 結果 | $STATUS |"
            if [ "$REBUILD" = "yes" ]; then echo "| 種別 | rebuild（国会側の data/ を消してから作り直した。消した内訳は上の表） |"; fi
            echo "| データ PR | $PR_CELL |"
            echo "| 変更ファイル数 | ${CHANGED:-?} |"
            echo "| unmatched（名寄せ不能。unmatched.json + unmatched/*.json） | $(count_unmatched) |"
            echo "| unmatched-bills（審議結果と未突合の採決） | $(count data/unmatched-bills.json) |"
            echo
            echo "<details><summary>ETL ログの警告</summary>"
            echo
            echo '```'
            grep -E "unmatched|group mismatch|violation|Error" etl.log || echo "(none)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # auto-merge は CI 完了を待つだけで Deploy を起動しない（GITHUB_TOKEN のマージは push イベントを起こさない）ので、
      # マージを待ってから deploy-data.yml（staging + production-data）を明示的に起動する。
      - name: Wait for data PR merge, then deploy
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          for i in $(seq 1 45); do   # 45 × 20s = 15 min
            STATE=$(gh pr view "$PR" --json state -q .state)
            echo "[$i] PR #$PR state=$STATE"
            case "$STATE" in
              MERGED) gh workflow run deploy-data.yml --ref main; echo "deploy-data.yml を起動した（staging + production）" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              CLOSED) echo "PR #$PR はマージされずに閉じられた" >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            esac
            # main が進んで BEHIND になっていたら追従させる（strict status checks のため auto-merge が止まる）
            if [ "$(gh pr view "$PR" --json mergeStateStatus -q .mergeStateStatus)" = "BEHIND" ]; then
              echo "PR #$PR is BEHIND main; updating branch"
              gh pr update-branch "$PR" || true
            fi
            # 承認待ち（action_required）の CI run があれば承認する
            for RUN in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$DATA_BRANCH&status=action_required" -q '.workflow_runs[].id'); do
              echo "approving run $RUN"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/approve" || true
            done
            sleep 20
          done
          echo "PR #$PR が 15 分以内にマージされなかった（required check が走っていない／失敗？）" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Open failure Issue (deduped by title)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.FAILURE_ISSUE_TITLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", labels: "etl", per_page: 100 });
            const dup = open.find((i) => i.title === title && !i.pull_request);
            if (dup) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: dup.number, body: `再度失敗: ${runUrl}` });
              core.info(`commented on existing #${dup.number}`);
              return;
            }
            const { data } = await github.rest.issues.create({
              ...context.repo, title, labels: ["etl", "infra"],
              body: [
                "ETL ワークフローが失敗しました。",
                "",
                `- 実行: ${runUrl}`,
                "- 手順と失敗モード: docs/ops/etl.md",
                "",
                "原因を直したら Issue を閉じてください（open のままだと次の失敗はこの Issue へのコメントになります）。",
              ].join("\n"),
            });
            core.info(`created #${data.number}`);
