name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Issue #536: a branch cut from an old `main` arrives as a PR that deletes the lines main gained in the
  # meantime. It happened 7 times over 2026-09-05..06 and every catch was a human reading the diff; the
  # PO was writing rebase instructions by hand for 8 open PRs. `git diff --stat` does not show it for a
  # docs-only PR ("1 file changed"), so nothing here knew.
  # Own job, first, with full history: `fetch-depth: 0` is required (the default depth-1 checkout has no
  # merge-base to compare against) and the answer is worth having before the 10-minute build starts.
  stale-base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # #556: 実測 6–10s（n=17）。無限ループは既定 6 時間走るので必ず上限を置く。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The branch must not be missing lines the base branch gained after it was cut (#536)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The check must not be able to pass by disappearing: a PR that deletes the script would
          # otherwise turn this step into a no-op (#504 — a check inside one file cannot defend that file,
          # so the demand that it exist lives in a different file, here).
          test -f scripts/ci/stale-base.sh || { echo "scripts/ci/stale-base.sh がありません（#536 の検査）"; exit 1; }
          git fetch --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" "$HEAD_SHA"
          # Compare against the PR's own head, NOT the checked-out `refs/pull/N/merge` — that ref already
          # IS the three-way merge, so it can never be missing anything and this job would say nothing.
          # Measured on the reconstructed #531 shape (docs/WORKING_AGREEMENT.md, base 85570ec2, main
          # dd5ac2ef): against the merge ref it reports 0 lines, against the head it reports 50.
          bash scripts/ci/stale-base.sh "refs/remotes/origin/$BASE_REF" "$HEAD_SHA"
  check:
    runs-on: ubuntu-latest
    # #556: 実測 min 153 / med 210 / max 225s（n=36）。同期の無限ループは testTimeout が効かず
    # （イベントループごとブロックする）、ここだけが止められる。max の 8 倍。負荷で伸びる分の余裕（#538/#501）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # #552: `ubuntu-latest` ships whatever shellcheck it ships, so the same tree got different answers on
      # CI (0.9.0) and on a developer's machine (0.11.0) — #542 lost a run to an SC2015 only 0.9.0 raised.
      # Measured on this repo's probes: `i+=1` is silent in 0.9.0 and SC2324 from 0.10.0 on, so the older
      # CI was *missing* real findings. The version comes from scripts/ci/shellcheck.sh so that there is one
      # place to change; the script itself refuses to run under any other version (exit 3).
      # #571: pinning the version pins the name, not the bytes -- GitHub Releases assets can in principle
      # be replaced (e.g. a compromised maintainer account), and this binary is placed in /usr/local/bin
      # and then fed the whole repository. The tarball's sha256 (from scripts/ci/shellcheck.sh, not
      # hardcoded here) is verified with `sha256sum -c` before extraction; a mismatch fails the step.
      - name: shellcheck (pinned version + sha256, #552, #571)
        run: |
          v=$(bash scripts/ci/shellcheck.sh --pinned-version)
          url=$(bash scripts/ci/shellcheck.sh --download-url)
          sha256=$(bash scripts/ci/shellcheck.sh --pinned-sha256)
          curl -sSfL "$url" -o shellcheck.tar.xz
          echo "$sha256  shellcheck.tar.xz" | sha256sum -c -
          tar -xJ --strip-components=1 -C /usr/local/bin -f shellcheck.tar.xz "shellcheck-v$v/shellcheck"
          rm -f shellcheck.tar.xz
          shellcheck --version | sed -n '2p'
      - name: shellcheck + bash tests (scripts/po, scripts/ci, deploy)
        run: |
          bash scripts/ci/shellcheck.sh # target list and pinned version live there (#154, #552) — same command locally
          bash scripts/po/test/run.sh
          # #533: this loop is itself a glob (three of them). Narrowing any one — e.g. rewriting the
          # pattern to `scripts/ci/test/[a-c]*.test.sh` — makes files stop running with no red anywhere,
          # because a file that never runs cannot fail. `ran` counts iterations of THIS loop, not files on
          # disk, so a narrowed pattern is caught even if nothing else in the repo re-derives the count.
          ran=0
          for t in scripts/ci/test/*.test.sh scripts/dev/test/*.test.sh deploy/test/*.test.sh; do echo "== $t"; bash "$t"; ran=$((ran+1)); done
          # #652: deploy/test に nginx-headers-gate-behavior.test.sh が増え、#646 で
          # scripts/ci/test/link-check.test.sh も増えて**実測 27 本**になったので、
          # 下限を 24 → 25 に上げる（#642 で 23 → 24。実測より下に余裕を残すのは従来どおり。
          # deploy/test の**正確な**本数は packages/etl/test/deploy-test-inventory.test.ts が
          # EXPECTED_COUNT=19 で固定しており、ここは glob が痩せていないことを見る粗い最終防波堤）。
          # #537 が片付いて human-tasks.test.sh が増え**実測 30 本**になったので 25 → 27 に上げる
          # （#720 の「実数 − 3」。テストを増やした PR がそのついでに上げる）。
          echo "loop ran: $ran (floor 27)"
          [ "$ran" -ge 27 ] || { echo "FAIL: fewer test files ran than expected — glob narrowed or files deleted"; exit 1; }
      - run: pnpm lint
      - name: actionlint (all workflows)
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash | bash -s 1.7.7 /tmp >/dev/null
          /tmp/actionlint -color
      - run: pnpm typecheck
      # #464: apps/web/app/routes/rollcalls-bill-weight.browser.test.tsx は
      # 実ブラウザの computed style を読む（jsdom は継承も @media も解かないので使えない）。
      # ブラウザは 1 回起動して page.setContent で測るだけ——サーバもビルドも要らないので
      # `pnpm test` の中に置ける。ここに Chromium が無いと **そのテストだけが落ちる**。
      # docker-web ジョブと同じキャッシュの形（キーはバージョンなので両ジョブで共有される）。
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Playwright
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter web exec playwright install-deps chromium
          else
            pnpm --filter web exec playwright install --with-deps chromium
          fi
      # #533: `pnpm test` runs vitest (apps/web) and `node --test` (packages/etl), both driven by a glob
      # (vitest.config.ts's `include`, and `test/*.test.ts` in packages/etl/package.json). A glob that
      # quietly matches fewer files makes tests disappear with no red anywhere — the deleted test simply
      # never runs. packages/etl/test/test-file-inventory.test.ts checks the same globs from inside etl's
      # own test run, but that file is itself one of the files the etl glob matches, so deleting it removes
      # the only thing that would have said so (measured: deleting it drops etl's own test count by 6 and
      # nothing calls that out). This step is the layer above that: it lives in ci.yml itself, which no
      # test file can delete, and does not depend on either test runner still working.
      - name: Test file count floor (#533) — glob shrinkage in vitest/node:test must not go silent
        run: |
          set -euo pipefail
          web=$(find apps/web/app \( -name '*.test.ts' -o -name '*.test.tsx' \) | wc -l)
          etl=$(find packages/etl/test -maxdepth 1 -name '*.test.ts' | wc -l)
          echo "apps/web test files: $web (floor 85)"
          echo "packages/etl test files: $etl (floor 99)"
          fail=0
          [ "$web" -ge 85 ] || { echo "FAIL: apps/web test files dropped below floor"; fail=1; }
          [ "$etl" -ge 99 ] || { echo "FAIL: packages/etl test files dropped below floor"; fail=1; }
          [ "$fail" = 0 ]
      - run: pnpm test
      - run: pnpm build
        env: { SITE_ORIGIN: "${{ vars.SITE_ORIGIN }}" } # unset → relative URLs (#57); set the repo variable once the domain is decided (#15)
      - name: Smoke — built pages exist, internal links resolve, sitemap.xml lists every page
        run: pnpm --filter web smoke
      - name: Guard — no server runtime code reaches the browser
        run: |
          # Source: nothing that only makes sense on a server
          ! grep -rEl "use server|express\(|createServer\(" apps/web/app || (echo "server code found in apps/web/app" && exit 1)
          # Client bundle: no Node APIs / env / filesystem paths leaked into what we ship
          ! grep -rEl "node:fs|readFile|process\.env|SEIJI_DATA_DIR|/home/" apps/web/build/client/assets || (echo "Node/env code leaked into client bundle" && exit 1)
          # Only static files get deployed
          test -d apps/web/build/client
      - uses: actions/upload-artifact@v4
        with: { name: site, path: apps/web/build/client, retention-days: 3 }
  docker-web:
    # Issue #85: the same compose file that serves production must bring up the built site locally and pass
    # the smoke test over HTTP (status, SPA fallback, security headers, Cache-Control).
    # Issue #127: both services (web :8081, web-staging :8083) come up from the same build; the staging
    # X-Robots-Tag is keyed on the Host header, so it is checked with curl against either container.
    # Issue #194: headers alone missed a CSP that blocked every inline <script> (no hydration in production), so
    # apps/web/scripts/browser-check.ts opens the served pages in headless Chromium (Playwright) and fails on any
    # console error / CSP violation and when the members search does not filter.
    # Issue #479: the same script also opens 4 pages with `javaScriptEnabled: false`. `ssr: false` + `prerender`
    # means the HTML written at build time is all a crawler / a JS-less reader ever gets, and a broken prerender
    # config produces an empty shell that the JS-enabled checks above hydrate back into shape. The expected text
    # comes from data/ (member name, bill title, tally, the primary-source link), not from a character count.
    needs: check
    runs-on: ubuntu-latest
    # #556: 実測 min 72 / med 84 / max 96s（n=35）。max の 12 倍。
    timeout-minutes: 20
    env:
      SITE_DIR: ${{ github.workspace }}/apps/web/build/client
      STAGING_SITE_DIR: ${{ github.workspace }}/apps/web/build/client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: site, path: apps/web/build/client }
      - name: docker compose config
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: docker compose up
        run: |
          docker compose -f deploy/docker-compose.yml up -d --wait --wait-timeout 60
          docker compose -f deploy/docker-compose.yml ps
      - name: Smoke (URL mode, production container) — served pages, SPA fallback, security headers and cache policy
        run: pnpm --filter web smoke -- --url http://127.0.0.1:8081
      - name: Smoke (URL mode, staging container :8083)
        run: pnpm --filter web smoke -- --url http://127.0.0.1:8083
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Playwright
        # browsers come from the cache; the OS deps (fonts, libs) are cheap and always installed
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter web exec playwright install-deps chromium
          else
            pnpm --filter web exec playwright install --with-deps chromium
          fi
      - name: Browser check (#194) — no console error / CSP violation on /, /members/, /rollcalls/, a member page; members search filters; and (#479) the records are readable with JavaScript disabled
        run: pnpm --filter web browser-check -- --url http://127.0.0.1:8081
      - name: Staging noindex — X-Robots-Tag only for Host staging.giinrecord.jp (deploy/nginx/site.conf)
        run: |
          curl -sSI -H 'Host: staging.giinrecord.jp' http://127.0.0.1:8083/ | tr -d '\r' | grep -i '^x-robots-tag: noindex, nofollow$'
          ! curl -sSI -H 'Host: giinrecord.jp' http://127.0.0.1:8081/ | grep -qi '^x-robots-tag' || (echo "production must not send X-Robots-Tag" && exit 1)
          ! curl -sSI http://127.0.0.1:8083/ | grep -qi '^x-robots-tag' || (echo "X-Robots-Tag must depend on Host, not on the port" && exit 1)
      - name: Not found (#325) — unknown URLs are 404, every pre-rendered route is still 200, /compare stays 200
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8081
          # A real member id from the built site: the 404 rule must not touch pre-rendered pages.
          MEMBER=$(basename "$(find apps/web/build/client/members -mindepth 1 -maxdepth 1 -type d | sort | head -1)")
          echo "member sample: $MEMBER"
          status() { curl -sS -o /dev/null -w '%{http_code}' "$BASE$1"; }
          expect() {
            got=$(status "$1")
            if [ "$got" != "$2" ]; then echo "FAIL $1 -> $got (expected $2)"; exit 1; fi
            echo "ok   $1 -> $got"
          }
          # pre-rendered routes: unchanged
          expect /                          200
          expect /members/                  200
          expect "/members/$MEMBER/"        200
          expect /coverage/                 200
          expect /assemblies/               200
          expect /rollcalls/                200
          expect /about/                    200
          # #104: query-driven, deliberately not pre-rendered — the route a careless =404 breaks
          expect '/compare?m=m_1,m_2'       200
          # #325: not a route at all
          expect /this-does-not-exist/      404
          expect /bills/                    404
          expect /search/                   404
          expect /members/m_no_such_member/ 404
          expect /__spa-fallback.html       404
          # #610: the not-found page itself must not be reachable as a second, 200 URL either
          expect /__not-found/index.html    404
          # the 404 must still carry a body: lang=ja, the site name, noindex, and no developer message
          body=$(curl -sS "$BASE/this-does-not-exist/")
          echo "$body" | grep -q '<html lang="ja"' || (echo "404 body: lang is not ja" && exit 1)
          echo "$body" | grep -q '議員レコード' || (echo "404 body: <title> lacks the site name" && exit 1)
          echo "$body" | grep -q 'noindex' || (echo "404 body: no noindex" && exit 1)
          ! echo "$body" | grep -q 'Hey developer' || (echo "404 body: React Router default fallback" && exit 1)
          # #610: without JavaScript the 404 body used to stay at "読み込んでいます…" (Loading…, 22 chars).
          # curl never runs JS, so this is exactly what a JS-disabled visitor (or a crawler) sees.
          echo "$body" | grep -q '見つかりません' || (echo "404 body: 「見つかりません」 is missing without JavaScript (#610)" && exit 1)
          echo "ok   404 body: lang=ja, site name, noindex, no developer message, 「見つかりません」 without JS (#610)"
          # #104 / #610: /compare must still be the empty SPA shell, not the not-found body (fallback file is shared plumbing)
          compare_body=$(curl -sS "$BASE/compare?m=m_1,m_2")
          ! echo "$compare_body" | grep -q '見つかりません' || (echo "/compare body: 「見つかりません」 leaked into a normal SPA-fallback page (#610)" && exit 1)
          echo "ok   /compare body: no 「見つかりません」 leak"
      - name: Legacy domain 301 (#192) — gikailog.jp hosts redirect to giinrecord.jp, path preserved
        run: |
          curl -sSI -H 'Host: gikailog.jp' http://127.0.0.1:8081/members/ | tr -d '\r' | grep -i '^location: https://giinrecord.jp/members/$'
          curl -sSI -H 'Host: www.gikailog.jp' http://127.0.0.1:8081/ | tr -d '\r' | grep -i '^location: https://giinrecord.jp/$'
          curl -sSI -H 'Host: www.giinrecord.jp' http://127.0.0.1:8081/ | tr -d '\r' | grep -i '^location: https://giinrecord.jp/$'
          curl -sSI -H 'Host: staging.gikailog.jp' http://127.0.0.1:8083/ | tr -d '\r' | grep -i '^location: https://staging.giinrecord.jp/$'
      - name: container logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --no-color | tail -50
