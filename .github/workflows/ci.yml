name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: shellcheck + bash tests (scripts/po, scripts/ci, deploy)
        run: |
          shellcheck --version | head -2
          bash scripts/ci/shellcheck.sh # target list lives there (Issue #154) — same command locally
          bash scripts/po/test/run.sh
          for t in scripts/ci/test/*.test.sh deploy/test/*.test.sh; do echo "== $t"; bash "$t"; done
      - run: pnpm lint
      - name: actionlint (all workflows)
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash | bash -s 1.7.7 /tmp >/dev/null
          /tmp/actionlint -color
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env: { SITE_ORIGIN: "${{ vars.SITE_ORIGIN }}" } # unset → relative URLs (#57); set the repo variable once the domain is decided (#15)
      - name: Smoke — built pages exist, internal links resolve, sitemap.xml lists every page
        run: pnpm --filter web smoke
      - name: Guard — no server runtime code reaches the browser
        run: |
          # Source: nothing that only makes sense on a server
          ! grep -rEl "use server|express\(|createServer\(" apps/web/app || (echo "server code found in apps/web/app" && exit 1)
          # Client bundle: no Node APIs / env / filesystem paths leaked into what we ship
          ! grep -rEl "node:fs|readFile|process\.env|SEIJI_DATA_DIR|/home/" apps/web/build/client/assets || (echo "Node/env code leaked into client bundle" && exit 1)
          # Only static files get deployed
          test -d apps/web/build/client
      - uses: actions/upload-artifact@v4
        with: { name: site, path: apps/web/build/client, retention-days: 3 }
  docker-web:
    # Issue #85: the same compose file that serves production must bring up the built site locally and pass
    # the smoke test over HTTP (status, SPA fallback, security headers, Cache-Control).
    # Issue #127: both services (web :8081, web-staging :8083) come up from the same build; the staging
    # X-Robots-Tag is keyed on the Host header, so it is checked with curl against either container.
    # Issue #194: headers alone missed a CSP that blocked every inline <script> (no hydration in production), so
    # apps/web/scripts/browser-check.ts opens the served pages in headless Chromium (Playwright) and fails on any
    # console error / CSP violation and when the members search does not filter.
    needs: check
    runs-on: ubuntu-latest
    env:
      SITE_DIR: ${{ github.workspace }}/apps/web/build/client
      STAGING_SITE_DIR: ${{ github.workspace }}/apps/web/build/client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: site, path: apps/web/build/client }
      - name: docker compose config
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: docker compose up
        run: |
          docker compose -f deploy/docker-compose.yml up -d --wait --wait-timeout 60
          docker compose -f deploy/docker-compose.yml ps
      - name: Smoke (URL mode, production container) — served pages, SPA fallback, security headers and cache policy
        run: pnpm --filter web smoke -- --url http://127.0.0.1:8081
      - name: Smoke (URL mode, staging container :8083)
        run: pnpm --filter web smoke -- --url http://127.0.0.1:8083
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Playwright
        # browsers come from the cache; the OS deps (fonts, libs) are cheap and always installed
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter web exec playwright install-deps chromium
          else
            pnpm --filter web exec playwright install --with-deps chromium
          fi
      - name: Browser check (#194) — no console error / CSP violation on /, /members/, /rollcalls/, a member page; members search filters
        run: pnpm --filter web browser-check -- --url http://127.0.0.1:8081
      - name: Staging noindex — X-Robots-Tag only for Host staging.gikailog.jp (deploy/nginx/site.conf)
        run: |
          curl -sSI -H 'Host: staging.gikailog.jp' http://127.0.0.1:8083/ | tr -d '\r' | grep -i '^x-robots-tag: noindex, nofollow$'
          ! curl -sSI -H 'Host: gikailog.jp' http://127.0.0.1:8081/ | grep -qi '^x-robots-tag' || (echo "production must not send X-Robots-Tag" && exit 1)
          ! curl -sSI http://127.0.0.1:8083/ | grep -qi '^x-robots-tag' || (echo "X-Robots-Tag must depend on Host, not on the port" && exit 1)
      - name: container logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --no-color | tail -50
