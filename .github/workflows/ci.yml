name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: shellcheck + bash tests (scripts/po, scripts/ci, deploy)
        run: |
          shellcheck --version | head -2
          bash scripts/ci/shellcheck.sh # target list lives there (Issue #154) — same command locally
          bash scripts/po/test/run.sh
          for t in scripts/ci/test/*.test.sh deploy/test/*.test.sh; do echo "== $t"; bash "$t"; done
      - run: pnpm lint
      - name: actionlint (all workflows)
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash | bash -s 1.7.7 /tmp >/dev/null
          /tmp/actionlint -color
      - run: pnpm typecheck
      # #464: apps/web/app/routes/rollcalls-bill-weight.browser.test.tsx は
      # 実ブラウザの computed style を読む（jsdom は継承も @media も解かないので使えない）。
      # ブラウザは 1 回起動して page.setContent で測るだけ——サーバもビルドも要らないので
      # `pnpm test` の中に置ける。ここに Chromium が無いと **そのテストだけが落ちる**。
      # docker-web ジョブと同じキャッシュの形（キーはバージョンなので両ジョブで共有される）。
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Playwright
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter web exec playwright install-deps chromium
          else
            pnpm --filter web exec playwright install --with-deps chromium
          fi
      - run: pnpm test
      - run: pnpm build
        env: { SITE_ORIGIN: "${{ vars.SITE_ORIGIN }}" } # unset → relative URLs (#57); set the repo variable once the domain is decided (#15)
      - name: Smoke — built pages exist, internal links resolve, sitemap.xml lists every page
        run: pnpm --filter web smoke
      - name: Guard — no server runtime code reaches the browser
        run: |
          # Source: nothing that only makes sense on a server
          ! grep -rEl "use server|express\(|createServer\(" apps/web/app || (echo "server code found in apps/web/app" && exit 1)
          # Client bundle: no Node APIs / env / filesystem paths leaked into what we ship
          ! grep -rEl "node:fs|readFile|process\.env|SEIJI_DATA_DIR|/home/" apps/web/build/client/assets || (echo "Node/env code leaked into client bundle" && exit 1)
          # Only static files get deployed
          test -d apps/web/build/client
      - uses: actions/upload-artifact@v4
        with: { name: site, path: apps/web/build/client, retention-days: 3 }
  docker-web:
    # Issue #85: the same compose file that serves production must bring up the built site locally and pass
    # the smoke test over HTTP (status, SPA fallback, security headers, Cache-Control).
    # Issue #127: both services (web :8081, web-staging :8083) come up from the same build; the staging
    # X-Robots-Tag is keyed on the Host header, so it is checked with curl against either container.
    # Issue #194: headers alone missed a CSP that blocked every inline <script> (no hydration in production), so
    # apps/web/scripts/browser-check.ts opens the served pages in headless Chromium (Playwright) and fails on any
    # console error / CSP violation and when the members search does not filter.
    # Issue #479: the same script also opens 4 pages with `javaScriptEnabled: false`. `ssr: false` + `prerender`
    # means the HTML written at build time is all a crawler / a JS-less reader ever gets, and a broken prerender
    # config produces an empty shell that the JS-enabled checks above hydrate back into shape. The expected text
    # comes from data/ (member name, bill title, tally, the primary-source link), not from a character count.
    needs: check
    runs-on: ubuntu-latest
    env:
      SITE_DIR: ${{ github.workspace }}/apps/web/build/client
      STAGING_SITE_DIR: ${{ github.workspace }}/apps/web/build/client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: site, path: apps/web/build/client }
      - name: docker compose config
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: docker compose up
        run: |
          docker compose -f deploy/docker-compose.yml up -d --wait --wait-timeout 60
          docker compose -f deploy/docker-compose.yml ps
      - name: Smoke (URL mode, production container) — served pages, SPA fallback, security headers and cache policy
        run: pnpm --filter web smoke -- --url http://127.0.0.1:8081
      - name: Smoke (URL mode, staging container :8083)
        run: pnpm --filter web smoke -- --url http://127.0.0.1:8083
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Playwright
        # browsers come from the cache; the OS deps (fonts, libs) are cheap and always installed
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter web exec playwright install-deps chromium
          else
            pnpm --filter web exec playwright install --with-deps chromium
          fi
      - name: Browser check (#194) — no console error / CSP violation on /, /members/, /rollcalls/, a member page; members search filters; and (#479) the records are readable with JavaScript disabled
        run: pnpm --filter web browser-check -- --url http://127.0.0.1:8081
      - name: Staging noindex — X-Robots-Tag only for Host staging.giinrecord.jp (deploy/nginx/site.conf)
        run: |
          curl -sSI -H 'Host: staging.giinrecord.jp' http://127.0.0.1:8083/ | tr -d '\r' | grep -i '^x-robots-tag: noindex, nofollow$'
          ! curl -sSI -H 'Host: giinrecord.jp' http://127.0.0.1:8081/ | grep -qi '^x-robots-tag' || (echo "production must not send X-Robots-Tag" && exit 1)
          ! curl -sSI http://127.0.0.1:8083/ | grep -qi '^x-robots-tag' || (echo "X-Robots-Tag must depend on Host, not on the port" && exit 1)
      - name: Not found (#325) — unknown URLs are 404, every pre-rendered route is still 200, /compare stays 200
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8081
          # A real member id from the built site: the 404 rule must not touch pre-rendered pages.
          MEMBER=$(basename "$(find apps/web/build/client/members -mindepth 1 -maxdepth 1 -type d | sort | head -1)")
          echo "member sample: $MEMBER"
          status() { curl -sS -o /dev/null -w '%{http_code}' "$BASE$1"; }
          expect() {
            got=$(status "$1")
            if [ "$got" != "$2" ]; then echo "FAIL $1 -> $got (expected $2)"; exit 1; fi
            echo "ok   $1 -> $got"
          }
          # pre-rendered routes: unchanged
          expect /                          200
          expect /members/                  200
          expect "/members/$MEMBER/"        200
          expect /coverage/                 200
          expect /assemblies/               200
          expect /rollcalls/                200
          expect /about/                    200
          # #104: query-driven, deliberately not pre-rendered — the route a careless =404 breaks
          expect '/compare?m=m_1,m_2'       200
          # #325: not a route at all
          expect /this-does-not-exist/      404
          expect /bills/                    404
          expect /search/                   404
          expect /members/m_no_such_member/ 404
          expect /__spa-fallback.html       404
          # the 404 must still carry a body: lang=ja, the site name, noindex, and no developer message
          body=$(curl -sS "$BASE/this-does-not-exist/")
          echo "$body" | grep -q '<html lang="ja"' || (echo "404 body: lang is not ja" && exit 1)
          echo "$body" | grep -q '議員レコード' || (echo "404 body: <title> lacks the site name" && exit 1)
          echo "$body" | grep -q 'noindex' || (echo "404 body: no noindex" && exit 1)
          ! echo "$body" | grep -q 'Hey developer' || (echo "404 body: React Router default fallback" && exit 1)
          echo "ok   404 body: lang=ja, site name, noindex, no developer message"
      - name: Legacy domain 301 (#192) — gikailog.jp hosts redirect to giinrecord.jp, path preserved
        run: |
          curl -sSI -H 'Host: gikailog.jp' http://127.0.0.1:8081/members/ | tr -d '\r' | grep -i '^location: https://giinrecord.jp/members/$'
          curl -sSI -H 'Host: www.gikailog.jp' http://127.0.0.1:8081/ | tr -d '\r' | grep -i '^location: https://giinrecord.jp/$'
          curl -sSI -H 'Host: www.giinrecord.jp' http://127.0.0.1:8081/ | tr -d '\r' | grep -i '^location: https://giinrecord.jp/$'
          curl -sSI -H 'Host: staging.gikailog.jp' http://127.0.0.1:8083/ | tr -d '\r' | grep -i '^location: https://staging.giinrecord.jp/$'
      - name: container logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --no-color | tail -50
