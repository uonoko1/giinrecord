name: ETL districts (monthly)
# 選挙区データ（郵便番号 → 参院選挙区・衆院小選挙区）の月次 ETL（Issue #111）。日本郵便 KEN_ALL は月末更新なので毎月 2 日に流す。
# data PR の流れは日次 etl.yml と同じ（docs/ops/etl.md）。ブランチ名と失敗 Issue のタイトルだけ別。
on:
  schedule:
    - cron: "0 20 1 * *"   # 05:00 JST on the 2nd of every month (KEN_ALL は月末更新)
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write        # failure → auto Issue
  actions: write       # gh workflow run deploy-data.yml / approve pending runs
concurrency:
  group: etl           # 日次 ETL と直列化（同時に data PR を作らない）
  cancel-in-progress: false
env:
  DATA_BRANCH: data/districts
  FAILURE_ISSUE_TITLE: "選挙区 ETL 月次実行が失敗した（districts.yml）"
jobs:
  districts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 日次 ETL と同じイメージ（packages/etl/Dockerfile）。ENTRYPOINT だけ districts-cli.ts に差し替える。
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/etl/Dockerfile
          push: false
          load: true
          tags: gikailog-etl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # KEN_ALL（zip）・総務省ページ・北海道のページは毎回取得する（月次なのでキャッシュの復元はしない）。
      # `shell: bash` で pipefail を効かせる（ETL の非0終了が tee に隠れないように。packages/etl/test/workflow-districts.test.ts）。
      - name: Run districts ETL
        shell: bash
        run: |
          mkdir -p packages/etl/.cache
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/data:/app/data" -v "$PWD/packages/etl/.cache:/app/packages/etl/.cache" \
            --entrypoint node gikailog-etl:ci --import tsx src/districts-cli.ts 2>&1 | tee etl.log

      - name: Open / update data PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gikailog-etl[bot]"
          git config user.email "etl@users.noreply.github.com"
          git add data
          CHANGED=$(git diff --cached --name-only | wc -l | tr -d ' ')
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "0" ]; then echo "no data changes"; echo "number=" >> "$GITHUB_OUTPUT"; exit 0; fi
          STAMP=$(date -u +%Y-%m-%dT%H:%MZ)
          git switch -c "$DATA_BRANCH"
          git commit -m "data: districts $STAMP"
          # 既存ブランチへの force-push は GITHUB_TOKEN（workflows 権限なし）が拒否することがあるので、削除して新規 push する（etl.yml と同じ）。
          git push origin --delete "$DATA_BRANCH" 2>/dev/null || true
          git push origin "$DATA_BRANCH"
          NUMBER=$(gh pr list --head "$DATA_BRANCH" --state open --json number -q ".[0].number")
          if [ -z "$NUMBER" ]; then
            gh pr create --base main --head "$DATA_BRANCH" --title "data: districts $STAMP" \
              --body "Automated districts ETL output (KEN_ALL × 総務省 小選挙区の区域). Validated by validateDistricts in the ETL run." --label etl
            NUMBER=$(gh pr list --head "$DATA_BRANCH" --state open --json number -q ".[0].number")
          fi
          test -n "$NUMBER"   # PR が無ければここで失敗させる（サイレント失敗対策）
          echo "data PR #$NUMBER"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          gh pr merge "$NUMBER" --squash --auto

      - name: Job summary
        if: always()
        env:
          PR: ${{ steps.pr.outputs.number }}
          CHANGED: ${{ steps.pr.outputs.changed }}
          STATUS: ${{ job.status }}
        run: |
          field() { node -e 'const m=JSON.parse(require("fs").readFileSync("data/districts/meta.json","utf8"));console.log(process.argv[1].split(".").reduce((o,k)=>o?.[k],m)??"?")' "$1" 2>/dev/null || echo "?"; }
          if [ -n "$PR" ]; then PR_CELL="#$PR"; else PR_CELL="なし（data/ に変更なし）"; fi
          {
            echo "## ETL districts"
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| 結果 | $STATUS |"
            echo "| データ PR | $PR_CELL |"
            echo "| 変更ファイル数 | ${CHANGED:-?} |"
            echo "| KEN_ALL 更新日 | $(field asOf.kenAll) |"
            echo "| 郵便番号 | $(field counts.zips) |"
            echo "| 市区町村 | $(field counts.municipalities) |"
            echo "| 小選挙区 | $(field counts.shugiinDistricts) |"
            echo "| 分割市区町村（候補を並べた。推定しない） | $(field counts.splitMunicipalities) |"
            echo
            echo "<details><summary>ETL ログ</summary>"
            echo
            echo '```'
            cat etl.log 2>/dev/null || echo "(none)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # auto-merge は Deploy を起動しない（GITHUB_TOKEN のマージは push イベントを起こさない）ので、マージを待って deploy-data.yml を起動する（etl.yml と同じ）。
      - name: Wait for data PR merge, then deploy
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          for i in $(seq 1 45); do   # 45 × 20s = 15 min
            STATE=$(gh pr view "$PR" --json state -q .state)
            echo "[$i] PR #$PR state=$STATE"
            case "$STATE" in
              MERGED) gh workflow run deploy-data.yml --ref main; echo "deploy-data.yml を起動した（staging + production）" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              CLOSED) echo "PR #$PR はマージされずに閉じられた" >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            esac
            if [ "$(gh pr view "$PR" --json mergeStateStatus -q .mergeStateStatus)" = "BEHIND" ]; then
              echo "PR #$PR is BEHIND main; updating branch"
              gh pr update-branch "$PR" || true
            fi
            for RUN in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$DATA_BRANCH&status=action_required" -q '.workflow_runs[].id'); do
              echo "approving run $RUN"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/approve" || true
            done
            sleep 20
          done
          echo "PR #$PR が 15 分以内にマージされなかった（required check が走っていない／失敗？）" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Open failure Issue (deduped by title)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.FAILURE_ISSUE_TITLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", labels: "etl", per_page: 100 });
            const dup = open.find((i) => i.title === title && !i.pull_request);
            if (dup) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: dup.number, body: `再度失敗: ${runUrl}` });
              core.info(`commented on existing #${dup.number}`);
              return;
            }
            const { data } = await github.rest.issues.create({
              ...context.repo, title, labels: ["etl", "infra"],
              body: [
                "選挙区 ETL ワークフロー（月次）が失敗しました。",
                "",
                `- 実行: ${runUrl}`,
                "- 手順と失敗モード: docs/ops/etl.md（選挙区 ETL の節）",
                "- 出典と as-of: docs/research/districts.md",
                "",
                "原因（KEN_ALL / 総務省 PDF / 北海道のページのレイアウト変化など）を直したら Issue を閉じてください。",
              ].join("\n"),
            });
            core.info(`created #${data.number}`);
