name: Release
# Issue #127: the production release button. `gh workflow run release.yml --ref main -f ref=$(git rev-parse origin/main)`
# (or Actions → Release → Run workflow) → build with vars.SITE_ORIGIN → rsync to /var/www/giinrecord/site/.
# Issue #659: NO approval step. The `production` environment has no protection_rules (measured 2026-09-08: all three
# environments return `[]`), so the run goes straight through — whoever dispatches this publishes to production.
# The only gate is main's branch protection (4 required checks), and `ref` here is free-form, so even that is bypassable
# by dispatching a ref that never passed CI. Do not treat "it deployed" as "someone reviewed it" — docs/ops/deploy.md.
# Nothing else writes production code; daily data goes through deploy-data.yml (environment production-data).
# Issue #134: after a successful release the lightweight tag `released` is moved to the released sha, so deploy-data.yml
# builds that code (not main) and lays main's data/ on top. Ref updates made with GITHUB_TOKEN trigger no other workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) to release to https://giinrecord.jp"
        required: true
        type: string
        default: main
permissions:
  contents: read
jobs:
  production:
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: production
      site_origin: ${{ vars.SITE_ORIGIN }}
      target_dir: site
      ref: ${{ inputs.ref }}
    secrets: inherit
  released-tag:
    # Only on success (default `needs` semantics). Runs outside the `production` environment: no deploy secret,
    # only contents: write for the tag ref (REST API, no checkout). Rollback = Release an older sha; the tag follows.
    needs: production
    runs-on: ubuntu-latest
    # #556: 実測 3–8s（n=39）。tag を動かすだけ。
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Move tag `released` to the released sha
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.production.outputs.sha }}
          REF: ${{ inputs.ref }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "deploy-site.yml returned no sha: '$SHA'"; exit 1; }
          if gh api "repos/$GH_REPO/git/ref/tags/released" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/released" -f sha="$SHA" -F force=true --silent
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/released -f sha="$SHA" --silent
          fi
          echo "tag \`released\` → \`$SHA\` (ref \`$REF\`); deploy-data.yml now builds this sha + data/ from main" >> "$GITHUB_STEP_SUMMARY"
