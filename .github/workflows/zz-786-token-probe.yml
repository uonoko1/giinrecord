name: zz 786 token probe
# 一時的な計測用（#786）。**この PR がマージされる前に削除する。**
# CI の既定 GITHUB_TOKEN で secret-scanning / dependabot のアラートを読めるかを実測する。
# workflow_dispatch は既定ブランチに無いと使えないので push で走らせる。
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: can the default GITHUB_TOKEN read the alert feeds?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for p in secret-scanning/alerts dependabot/alerts; do
            echo "=== $p"
            # 本文は出さない（秘密の値が入りうる）。**HTTP status と、読めたかどうかだけ**を出す。
            code=$(gh api "repos/$GITHUB_REPOSITORY/$p?state=open&per_page=1" --include 2>&1 | head -1 || true)
            echo "first line: $code"
            if gh api "repos/$GITHUB_REPOSITORY/$p?state=open&per_page=1" >/dev/null 2>"$RUNNER_TEMP/err"; then
              echo "RESULT $p: READABLE"
            else
              echo "RESULT $p: NOT READABLE (rc=$?)"
              # エラー本文には Authorization が混ざりうるので、**種類だけ**に落とす
              grep -oE 'HTTP [0-9]{3}|Resource not accessible|must have admin|not enabled' "$RUNNER_TEMP/err" | sort -u || true
            fi
          done
