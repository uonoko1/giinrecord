name: Branch protection
# Issue #521: main の保護設定が弱まっていないかを見張る。
#
# なぜ要るか: branch protection は GitHub の**設定**であって、このリポジトリの中身ではない。
# 弱めるのは API 1 回で済み、diff にもレビューにも CI にも一切現れない。実際 `enforce_admins` は false のまま
# 放置され、必須チェックを1つも通していない commit が 3 つ main に入った（#521）。
# push は成功し、git は `remote: Bypassed rule violations for refs/heads/main` としか言わない。
#
# この workflow は素通りを不可能にはしない（それは enforce_admins の仕事で、管理者はいつでも戻せる）。
# **隠れて通れなくする**: 弱まっていれば次の実行で Issue が開く。
# 作業合意「防御は不可能にすることではなく、隠れて通れなくすること」。
#
# 検査そのものは deploy/monitor/branch-protection.sh（テスト: deploy/test/branch-protection.test.sh）。
# Issue の開閉は monitor.yml と同じ deploy/monitor/report.sh に任せる（タイトルが同一性なので溜まらない）。
# 直し方と緊急時の逃げ道は docs/ops/deploy.md「main の保護設定」。
on:
  schedule:
    - cron: "23 21 * * *"   # 毎日 06:23 JST。monitor.yml の 10 分刻みとぶつからない分を選ぶ
  pull_request:
    # 検査そのものを触る PR では、その場で走らせて壊れていないことを見る
    paths:
      - ".github/workflows/branch-protection.yml"
      - "deploy/monitor/branch-protection.sh"
      - "deploy/test/branch-protection.test.sh"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  # branch protection の読み取りには管理権限が要る。#521 のマージ後、これが無い状態で
  # workflow_dispatch した結果、gh api が失敗して Issue #540 が開いた（実測）。
  administration: read
concurrency:
  group: branch-protection
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: unit tests (gh is a stub, no network)
        run: bash deploy/test/branch-protection.test.sh
      # PR では実際の設定を読まない: fork からの PR に issues:write は渡らず、Issue の開閉もしたくない。
      # 設定そのものの確認は schedule と workflow_dispatch でやる。
      # 2つの結果を、2つの別々の Issue として扱う（#540）。
      #   exit 1 = 設定が弱い        → "[monitor] repo: main の保護設定"
      #   exit 2 = 設定を読めなかった → "[monitor] repo: main の保護設定を読めない"
      # 同じタイトルにすると、片方が開いている間もう片方が開けない（report.sh はタイトルを同一性に使う）。
      # #540 は「読めなかった」のに「弱まっている」という本文で開いた。毎朝それが出ると本物と区別が付かない。
      #
      # stderr は $out に混ぜない（`2>&1` にしない）。gh の API エラーには Authorization ヘッダが混ざりうるが、
      # $out は公開 Issue の本文にそのまま入る。stderr は job のログにだけ出す。
      - name: check main's protection → Issue
        if: github.event_name != 'pull_request'
        env:
          # branch protection の読み取りには管理権限が要る。まず GITHUB_TOKEN の administration: read で試し、
          # それで足りなければ人間が置く fine-grained PAT を使う（手順は docs/ops/deploy.md「main の保護設定」）。
          # secret が無ければ空文字になり `||` で GITHUB_TOKEN に落ちる。
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          weak_title="[monitor] repo: main の保護設定"
          unreadable_title="[monitor] repo: main の保護設定を読めない"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          out=$(bash deploy/monitor/branch-protection.sh "$GITHUB_REPOSITORY" main); rc=$?
          echo "$out"
          case $rc in
            0)
              # どちらの Issue も閉じる
              bash deploy/monitor/report.sh "$weak_title" ok
              bash deploy/monitor/report.sh "$unreadable_title" ok
              ;;
            1)
              {
                echo "**main の branch protection が弱まっている。** CI を通さずに main へ入れる状態かもしれない（#521）。"
                echo
                echo '```'
                echo "$out"
                echo '```'
                echo
                echo "- run: $run_url"
                echo
                echo "直し方と、緊急時に一時的に外すときの手順は \`docs/ops/deploy.md\`「main の保護設定」。"
                echo "検査が通るようになれば、この Issue は自動で閉じる。"
              } > body.md
              bash deploy/monitor/report.sh "$weak_title" fail body.md
              exit 1
              ;;
            2)
              # 読めなかっただけで、設定が弱いとは限らない。**弱まっている側の Issue は触らない**
              # （開いていれば開いたまま、閉じていれば閉じたまま。判定できていないので勝手に閉じない）。
              {
                echo "**main の保護設定を読めなかった。** 設定が弱いかどうかは**判定できていない**（#540）。"
                echo
                echo '```'
                echo "$out"
                echo '```'
                echo
                echo "- run: $run_url"
                echo
                echo "**理由は run のログ（stderr）にある。** 認証情報が混ざりうるのでここには転記しない。"
                echo "よくある原因は権限で、branch protection の読み取りには \`administration: read\` が要る。"
                echo "それでも読めない場合は PAT が要る（**人間の作業**）。手順は \`docs/ops/deploy.md\`「main の保護設定」。"
                echo "読めるようになれば、この Issue は自動で閉じる。"
              } > body.md
              bash deploy/monitor/report.sh "$unreadable_title" fail body.md
              exit 1
              ;;
            *)
              echo "::error::branch-protection.sh が想定外の終了コード $rc を返した"
              exit 1
              ;;
          esac
