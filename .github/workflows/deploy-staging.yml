name: Deploy (staging)
# Issue #939: every push to main goes to https://staging.giinrecord.jp automatically (noindex build).
# Production is released by hand from release.yml. Daily data reaches both through deploy-data.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: staging
      site_origin: https://staging.giinrecord.jp
      target_dir: staging
      ref: ${{ github.sha }}
    secrets:
      # #1137: `inherit` をやめ、DEPLOY_* 4 件を名指しで渡す。`inherit` だと
      # `FORBIDDEN_PATTERNS` や将来増える secret も呼び先の全 job に流れ込む。
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
