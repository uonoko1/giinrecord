# nginx config INSIDE the web container (mounted at /etc/nginx/conf.d/default.conf by deploy/docker-compose.yml).
# Ported 1:1 from the former host server block (deploy/nginx-gikailog.conf, Sprint 1-5):
# SPA fallback, cache policy and security headers are unchanged — packages/etl/test/deploy-docker.test.ts
# pins the values, and the URL-mode smoke test checks them on the running container.
# TLS and the public hostname live on the host nginx (deploy/nginx-host-proxy.conf), not here.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pre-rendered routes: /members/xxx -> /members/xxx/index.html ; unknown -> SPA fallback
    location / {
        try_files $uri $uri/index.html /__spa-fallback.html;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Container healthcheck target (docker-compose.yml). Plain 200, no file access.
    location = /__health {
        access_log off;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self'" always;
}
