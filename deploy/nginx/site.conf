# nginx config INSIDE the web container (mounted at /etc/nginx/conf.d/default.conf by deploy/docker-compose.yml).
# Ported 1:1 from the former host server block (deploy/nginx-gikailog.conf, Sprint 1-5):
# SPA fallback, cache policy and security headers are unchanged — packages/etl/test/deploy-docker.test.ts
# pins the values, and the URL-mode smoke test checks them on the running container.
# TLS and the public hostname live on the host nginx (deploy/nginx-host-proxy.conf), not here.
# staging (Issue #127): the same file serves the `web-staging` container. The host proxy passes Host through,
# so staging.giinrecord.jp gets X-Robots-Tag: noindex here; production hosts map to "" and nginx omits the header.
# (The staging build also ships robots.txt Disallow: / and <meta name=robots content=noindex> — apps/web/app/lib/seo.ts.)
map $host $robots_tag {
    default "";
    staging.giinrecord.jp "noindex, nofollow";
}
# www -> apex on https. The host nginx (deploy/nginx-host-proxy.conf) redirects every plain-http request to
# https://giinrecord.jp itself, and proxies https for BOTH hostnames here unchanged (Host header passed through),
# so the https www -> apex policy lives in the container, not on the shared host (Issue #141).
server {
    listen 80;
    listen [::]:80;
    server_name www.giinrecord.jp;
    return 301 https://giinrecord.jp$request_uri;
}
# Rename #192 (議会ログ → 議員レコード): the legacy domain stays alive for at least a year and 301s
# to the new one, path preserved. The host nginx keeps proxying the old hostnames here unchanged,
# so the redirect lives in the container like the www policy above.
server {
    listen 80;
    listen [::]:80;
    server_name gikailog.jp www.gikailog.jp;
    return 301 https://giinrecord.jp$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name staging.gikailog.jp;
    return 301 https://staging.giinrecord.jp$request_uri;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Issue #189: no access log at all inside the container. nginx's default `combined` format would write the
    # client IP and User-Agent to stdout (= docker logs), contradicting the privacy policy. Page-view analytics
    # read the host nginx's IP-less "noip" log (docs/ops/analytics.md), so nothing is lost here.
    access_log off;

    # Pre-rendered routes: /members/xxx -> /members/xxx/index.html ; unknown -> SPA fallback
    location / {
        try_files $uri $uri/index.html /__spa-fallback.html;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
    }
    # Self-hosted fonts (#168): unicode-range slices, file names are not hashed -> 1 week, not immutable.
    location /fonts/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Container healthcheck target (docker-compose.yml). Plain 200, no file access.
    location = /__health {
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP (#194): script-src needs 'unsafe-inline' — React Router's pre-rendered HTML carries inline <script> tags
    # (hydration context, themeInit, install capture) whose content differs per page and per build, so a hash list is
    # not maintainable and nonces need a dynamic server. No external host is allowed in any directive (#168); the
    # site is static with no user-generated content, so inline script is low risk. apps/web/scripts/browser-check.ts
    # (CI docker-web) opens the served pages in Chromium and fails on any CSP violation or console error.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header X-Robots-Tag $robots_tag always;
}
