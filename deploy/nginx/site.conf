# nginx config INSIDE the web container (mounted at /etc/nginx/conf.d/default.conf by deploy/docker-compose.yml).
# Ported 1:1 from the former host server block (deploy/nginx-seiji-kiroku.conf, Sprint 1-5):
# SPA fallback, cache policy and security headers are unchanged — packages/etl/test/deploy-docker.test.ts
# pins the values, and the URL-mode smoke test checks them on the running container.
# TLS and the public hostname live on the host nginx (deploy/nginx-host-proxy.conf), not here.
# staging (Issue #127): the same file serves the `web-staging` container. The host proxy passes Host through,
# so staging.giinrecord.jp gets X-Robots-Tag: noindex here; production hosts map to "" and nginx omits the header.
# (The staging build also ships robots.txt Disallow: / and <meta name=robots content=noindex> — apps/web/app/lib/seo.ts.)
map $host $robots_tag {
    default "";
    staging.giinrecord.jp "noindex, nofollow";
}
# Issue 386: Server ヘッダから nginx のバージョンを消す。このファイルは conf.d/default.conf として
# **http ブロックの中**に読み込まれるので、ここに書けばこのコンテナの全 server ブロックに効く。
# コンテナは自サイト専用（nginx:alpine）なので、ホスト側と違って同居サイトへの波及は無い。
server_tokens off;

# www -> apex on https. The host nginx (deploy/nginx-host-proxy.conf) redirects every plain-http request to
# https://giinrecord.jp itself, and proxies https for BOTH hostnames here unchanged (Host header passed through),
# so the https www -> apex policy lives in the container, not on the shared host (Issue #141).
server {
    listen 80;
    listen [::]:80;
    server_name www.giinrecord.jp;
    return 301 https://giinrecord.jp$request_uri;
}
# Rename #192 (議会ログ → 議員レコード): the legacy domain stays alive for at least a year and 301s
# to the new one, path preserved. The host nginx keeps proxying the old hostnames here unchanged,
# so the redirect lives in the container like the www policy above.
server {
    listen 80;
    listen [::]:80;
    server_name gikailog.jp www.gikailog.jp;
    return 301 https://giinrecord.jp$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name staging.gikailog.jp;
    return 301 https://staging.giinrecord.jp$request_uri;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Issue #189: no access log at all inside the container. nginx's default `combined` format would write the
    # client IP and User-Agent to stdout (= docker logs), contradicting the privacy policy. Page-view analytics
    # read the host nginx's IP-less "noip" log (docs/ops/analytics.md), so nothing is lost here.
    access_log off;

    # Pre-rendered routes: /members/xxx -> /members/xxx/index.html.
    # Issue #325: an unknown path used to fall through to /__spa-fallback.html and answer **200**, so
    # /this-does-not-exist/ was indistinguishable from a real page — search engines indexed typo'd member
    # URLs and stale external links as real content. `=404` ends try_files with a 404, and `error_page`
    # below serves the SPA shell as the 404 body: the status stays 404, the body is still rendered
    # (the catch-all route in apps/web/app/routes.ts draws the "見つかりません" screen).
    location / {
        try_files $uri $uri/index.html =404;
    }
    # Issue #104: /compare is query-driven and deliberately NOT pre-rendered, so no HTML file exists for it
    # and the rule above would 404 it. It is a real route, so serve the SPA shell with 200. Exact match (`=`)
    # only: /compare/anything is not a route and must still 404.
    location = /compare {
        try_files /__spa-fallback.html =404;
    }
    # The 404 body is the SPA shell; React Router's catch-all route renders the not-found screen.
    # `internal` keeps the file itself unfetchable, so the same HTML is not reachable at a second, 200 URL.
    error_page 404 /__spa-fallback.html;
    location = /__spa-fallback.html {
        internal;
    }
    location /assets/ {
        # セキュリティヘッダ（#482）: この location は独自の add_header を持つので、
        # server 階層のものは**全部**効かない。同じ内容を複製する必要がある。理由は server 階層の
        # 「セキュリティヘッダ」の節。1か所直したら全部直すこと。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header X-Robots-Tag $robots_tag always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /data/ {
        # セキュリティヘッダ（#482）: この location は独自の add_header を持つので、
        # server 階層のものは**全部**効かない。同じ内容を複製する必要がある。理由は server 階層の
        # 「セキュリティヘッダ」の節。1か所直したら全部直すこと。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header X-Robots-Tag $robots_tag always;
        add_header Cache-Control "public, max-age=3600";
    }
    # Self-hosted fonts (#168): unicode-range slices, file names are not hashed -> 1 week, not immutable.
    location /fonts/ {
        # セキュリティヘッダ（#482）: この location は独自の add_header を持つので、
        # server 階層のものは**全部**効かない。同じ内容を複製する必要がある。理由は server 階層の
        # 「セキュリティヘッダ」の節。1か所直したら全部直すこと。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header X-Robots-Tag $robots_tag always;
        add_header Cache-Control "public, max-age=604800";
    }

    # Container healthcheck target (docker-compose.yml). Plain 200, no file access.
    location = /__health {
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- セキュリティヘッダ ----
    # **add_header は継承されない。** nginx では「ある階層に add_header が1つでもあれば、
    # 外側の階層の add_header は**全部**無効になる」（置き換えであって、足し算ではない）。
    # 下の /assets/ /data/ /fonts/ は Cache-Control を足しているので、ここ（server 階層）にだけ
    # 書くと **JS・CSS・JSON・フォントにセキュリティヘッダが1つも付かない**。
    # これは #482 で実測して判明した——**本番の /assets/*.js には CSP も nosniff も出ていなかった**
    # （HSTS だけは出る。あれはホスト nginx が付けているので、この罠の外にある）。
    # nginx には「文字列としての include」が無く、docker-compose がマウントするのもこの1ファイルだけ
    # （deploy/docker-compose.yml）なので、**location ごとの複製が唯一の手段**。
    # deploy/test/nginx-headers.test.sh が location ごとに実際に配信して確かめるので、
    # 1か所でも欠けると落ちる。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP (#194): script-src needs 'unsafe-inline' — React Router's pre-rendered HTML carries inline <script> tags
    # (hydration context, themeInit, install capture) whose content differs per page and per build, so a hash list is
    # not maintainable and nonces need a dynamic server. No external host is allowed in any directive (#168); the
    # site is static with no user-generated content, so inline script is low risk. apps/web/scripts/browser-check.ts
    # (CI docker-web) opens the served pages in Chromium and fails on any CSP violation or console error.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    # Permissions-Policy (#482): 使っていないブラウザ機能を明示的に閉じる。allowlist が空（`feature=()`）は
    # 「このページでも、このページが埋め込む iframe でも使えない」。**「全部閉じた」のではなく
    # 「使っていないと数えた 17 個を閉じた」**——数え方は PR に。CSP の script-src 'self' と二重の守りで、
    # 将来うっかり依存が増えたときはここを外す判断が要る = **気づける**。
    # `always` を付ける理由は上の4つと同じ: 404（= 存在しないパス。#325 で SPA shell を返す）にも出す。
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    add_header X-Robots-Tag $robots_tag always;
}
