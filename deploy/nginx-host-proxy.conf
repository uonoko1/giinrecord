# Server block on the SHARED host nginx, one per site (written by deploy/vps-setup.sh <domain> [port], which keeps
# this file and its heredoc identical — packages/etl/test/deploy-docker.test.ts — and substitutes the placeholders):
#   production  vps-setup.sh gikailog.jp 8081          → sites-available/gikailog.conf
#               SERVER_NAMES = gikailog.jp www.gikailog.jp   PORT = 8081   LOG_NAME = gikailog
#   staging     vps-setup.sh staging.gikailog.jp 8082  → sites-available/gikailog-staging.conf   (Issue #127)
#               SERVER_NAMES = staging.gikailog.jp          PORT = 8082   LOG_NAME = gikailog-staging
# The host only terminates TLS and forwards to the web container on loopback; every content rule
# (SPA fallback, caching, security headers, staging noindex) lives in deploy/nginx/site.conf inside the container.
# certbot adds the 443 block and the redirect: sudo certbot --nginx -d DOMAIN --redirect
# Access log: IP-less "noip" format (docs/ops/analytics.md); vps-setup.sh defines it in /etc/nginx/conf.d/.
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAMES;
    access_log /var/log/nginx/LOG_NAME.access.log noip;

    location / {
        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
