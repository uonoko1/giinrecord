# Server blocks on the SHARED host nginx, one file per site (written by deploy/vps-setup.sh <domain> [port], which keeps
# this file and its heredoc identical — packages/etl/test/deploy-docker.test.ts — and substitutes the placeholders):
#   production  vps-setup.sh giinrecord.jp 8081          → sites-available/giinrecord.conf
#               SERVER_NAMES = giinrecord.jp www.giinrecord.jp   DOMAIN = giinrecord.jp   PORT = 8081   LOG_NAME = giinrecord
#   staging     vps-setup.sh staging.giinrecord.jp 8083  → sites-available/giinrecord-staging.conf   (Issue #127)
#               SERVER_NAMES = staging.giinrecord.jp          DOMAIN = staging.giinrecord.jp   PORT = 8083   LOG_NAME = giinrecord-staging
# The host only terminates TLS and forwards to the web container on loopback; every content rule
# (SPA fallback, caching, security headers, staging noindex, www → apex on https) lives in deploy/nginx/site.conf.
#
# Issue #141: the redirects are defined HERE, not by certbot. Port 80 answers every name with 301 → https://DOMAIN
# (www included, so the hand edit made on the live host is now the template). The certificate is obtained with
# `certbot certonly --nginx` (no config editing); until it exists vps-setup.sh writes only a plain :80 proxy block
# (its BOOT heredoc) so the challenge can be served. A conf that certbot already manages is left alone
# (only the proxy_pass port is kept in sync).
# The redirect is a `location /`, not a server-level `return`: the ACME-challenge location certbot injects during
# issuance / renewal must take precedence, and it would not over a server-level return.
# Access log: IP-less "noip" format (docs/ops/analytics.md); vps-setup.sh defines it in /etc/nginx/conf.d/.
# Error log (Issue #189): a per-site error_log at `crit` so the shared host's global error log does not collect this
# site's connection-level failures (TLS handshake errors etc. carry the client IP). The per-site file is rotated by
# logrotate like every /var/log/nginx/*.log; the privacy policy states that these diagnostics may hold an IP briefly.
# Issue #163: CF_GATE in the 443 `location /` is replaced for STAGING (8083) by
#     include /etc/nginx/snippets/giinrecord-cloudflare-allow.conf;      allow <Cloudflare ranges>; deny all;
#     if ($http_cf_access_jwt_assertion = "") { return 403; }          no Cloudflare Access JWT → 403
# (deploy/cloudflare-allowlist.sh generates the snippet; docs/ops/staging-access.md) and DELETED for production.
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAMES;
    # Issue 386: Server ヘッダから nginx のバージョンと OS を消す。共用ホストなので
    # **http ブロックには置かない**（グローバルに効くと同居サイトの挙動まで変える。Issue 338 の学び）。
    server_tokens off;
    access_log /var/log/nginx/LOG_NAME.access.log noip;
    error_log /var/log/nginx/LOG_NAME.error.log crit;

    location / {
        return 301 https://DOMAIN$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name SERVER_NAMES;
    # Issue 386: この server ブロックだけ。http ブロックには置かない（同居サイトに波及するため）
    server_tokens off;
    access_log /var/log/nginx/LOG_NAME.access.log noip;
    error_log /var/log/nginx/LOG_NAME.error.log crit;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LOG_NAME:1m;
    ssl_session_tickets off;

    # HSTS（Issue 387）。**443 の server ブロックだけ**に置く（:80 は平文なのでブラウザが無視し、
    # 共用ホストのリダイレクトに載せる意味も無い）。
    #   - includeSubDomains は付けない: サブドメインを把握していない
    #     （staging.giinrecord.jp は Cloudflare Access の裏。影響を読み切れない）
    #   - preload は**絶対に付けない**: ブラウザに焼き込まれ事実上取り消せない。
    #     旧ドメイン gikailog.jp の 301 が現役なので巻き込めない
    #   - max-age は 1 日から始め、数週間おいて 1 年へ（docs/ops/deploy.md に上げ方と**下げ方**）
    add_header Strict-Transport-Security "max-age=86400" always;

    # !! この server の add_header は、**location 側に add_header を1つでも足すと全部消える** !!
    #    nginx の add_header の継承は「追加」ではなく「置換」で、警告も出ない（実測で確認済み）。
    #    下の `location /` に add_header を足すときは、**server レベルのヘッダをそこにも書き写す**こと。
    #    セキュリティヘッダ（CSP 等）はコンテナ側 site.conf にあるので、ここは HSTS だけ。

    location / {
CF_GATE
        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
