# Server blocks on the SHARED host nginx, one file per site (written by deploy/vps-setup.sh <domain> [port], which keeps
# this file and its heredoc identical — packages/etl/test/deploy-docker.test.ts — and substitutes the placeholders):
#   production  vps-setup.sh gikailog.jp 8081          → sites-available/gikailog.conf
#               SERVER_NAMES = gikailog.jp www.gikailog.jp   DOMAIN = gikailog.jp   PORT = 8081   LOG_NAME = gikailog
#   staging     vps-setup.sh staging.gikailog.jp 8083  → sites-available/gikailog-staging.conf   (Issue #127)
#               SERVER_NAMES = staging.gikailog.jp          DOMAIN = staging.gikailog.jp   PORT = 8083   LOG_NAME = gikailog-staging
# The host only terminates TLS and forwards to the web container on loopback; every content rule
# (SPA fallback, caching, security headers, staging noindex, www → apex on https) lives in deploy/nginx/site.conf.
#
# Issue #141: the redirects are defined HERE, not by certbot. Port 80 answers every name with 301 → https://DOMAIN
# (www included, so the hand edit made on the live host is now the template). The certificate is obtained with
# `certbot certonly --nginx` (no config editing); until it exists vps-setup.sh writes only a plain :80 proxy block
# (its BOOT heredoc) so the challenge can be served. A conf that certbot already manages is left alone
# (only the proxy_pass port is kept in sync).
# The redirect is a `location /`, not a server-level `return`: the ACME-challenge location certbot injects during
# issuance / renewal must take precedence, and it would not over a server-level return.
# Access log: IP-less "noip" format (docs/ops/analytics.md); vps-setup.sh defines it in /etc/nginx/conf.d/.
# Issue #163: CF_GATE in the 443 `location /` is replaced for STAGING (8083) by
#     include /etc/nginx/snippets/gikailog-cloudflare-allow.conf;      allow <Cloudflare ranges>; deny all;
#     if ($http_cf_access_jwt_assertion = "") { return 403; }          no Cloudflare Access JWT → 403
# (deploy/cloudflare-allowlist.sh generates the snippet; docs/ops/staging-access.md) and DELETED for production.
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAMES;
    access_log /var/log/nginx/LOG_NAME.access.log noip;

    location / {
        return 301 https://DOMAIN$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name SERVER_NAMES;
    access_log /var/log/nginx/LOG_NAME.access.log noip;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LOG_NAME:1m;
    ssl_session_tickets off;

    location / {
CF_GATE
        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
