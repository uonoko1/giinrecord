# /etc/nginx/sites-available/gikailog.conf on the SHARED host nginx (written by deploy/vps-setup.sh, which
# substitutes DOMAIN and keeps this file and its heredoc identical — packages/etl/test/deploy-docker.test.ts).
# The host only terminates TLS and forwards to the web container on loopback; every content rule
# (SPA fallback, caching, security headers) lives in deploy/nginx/site.conf inside the container.
# certbot adds the 443 block and the redirect: sudo certbot --nginx -d DOMAIN --redirect
# Access log: IP-less "noip" format (docs/ops/analytics.md); vps-setup.sh defines it in /etc/nginx/conf.d/.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    access_log /var/log/nginx/gikailog.access.log noip;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
