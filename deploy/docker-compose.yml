# web: the static site served by an nginx container (Issue #85).
#
#   production (VPS, run by a human with docker privileges — NOT the CI deploy user `ubuntu`):
#     docker compose -f deploy/docker-compose.yml up -d
#     → serves /var/www/seiji-kiroku/site (the rsync target of .github/workflows/deploy.yml, unchanged)
#       on 127.0.0.1:8081; the host nginx proxies TLS traffic to it (deploy/nginx-host-proxy.conf).
#   local / CI (same config, your own build output):
#     pnpm build && SITE_DIR=$PWD/apps/web/build/client docker compose -f deploy/docker-compose.yml up -d
#     pnpm --filter web smoke -- --url http://127.0.0.1:8081
#
# The site directory is mounted read-only: the container never writes to the deploy target.
# Nothing is published beyond loopback, so the container is reachable only through the host proxy.
name: seiji-kiroku
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ${SITE_DIR:-/var/www/seiji-kiroku/site}:/usr/share/nginx/html:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/__health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
