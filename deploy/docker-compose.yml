# web: the static site served by an nginx container (Issue #85).
# web-staging: the same image + config serving the staging build (Issue #127).
#
#   production + staging (VPS, run by a human with docker privileges — NOT the CI deploy user `ubuntu`):
#     docker compose -f deploy/docker-compose.yml up -d
#     → web         serves /var/www/gikailog/site    (rsync target of release.yml / deploy-data.yml) on 127.0.0.1:8081
#     → web-staging serves /var/www/gikailog/staging (rsync target of deploy-staging.yml / deploy-data.yml) on 127.0.0.1:8083
#       the host nginx proxies TLS traffic for giinrecord.jp / staging.giinrecord.jp to them (deploy/nginx-host-proxy.conf).
#   local / CI (same config, your own build output):
#     pnpm build && SITE_DIR=$PWD/apps/web/build/client STAGING_SITE_DIR=$PWD/apps/web/build/client \
#       docker compose -f deploy/docker-compose.yml up -d
#     pnpm --filter web smoke -- --url http://127.0.0.1:8081
#     pnpm --filter web smoke -- --url http://127.0.0.1:8083
#
# The site directories are mounted read-only: the containers never write to the deploy targets.
# Nothing is published beyond loopback, so the containers are reachable only through the host proxy.
# deploy/nginx/site.conf is shared: it adds X-Robots-Tag: noindex only when the Host is staging.giinrecord.jp.
# Logging (Issue #189): site.conf has `access_log off`, so docker logs only carry nginx's own error output. The
# json-file cap below rotates away anything older (including the pre-#189 access lines that recorded User-Agents).
name: gikailog
x-web: &web
  image: nginx:1.27-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/__health"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 5s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  web:
    <<: *web
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ${SITE_DIR:-/var/www/gikailog/site}:/usr/share/nginx/html:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
  web-staging:
    <<: *web
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ${STAGING_SITE_DIR:-/var/www/gikailog/staging}:/usr/share/nginx/html:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
