# logrotate for the self-hosted monitoring log (Issue #288). Installed to /etc/logrotate.d/giinrecord-monitor
# by deploy/monitor/setup.sh; checked by deploy/test/logrotate.test.sh.
#
# Why this file exists: /var/log/giinrecord-monitor.log matched no logrotate config. Ubuntu's
# /etc/logrotate.d/rsyslog lists specific file names (/var/log/syslog, /var/log/auth.log, ...) and does not
# rotate /var/log/*.log, so this log grew without bound.
#
# The VPS is shared with other sites, so exactly one file is named here — never a glob under /var/log.
#
# Size and retention, from the log itself (measured 2026-08-27):
#   129012 bytes over 3.11 days since it was created  ->  ~41 KB/day  (~1.2 MB/month)
#   the cron is */5 (deploy/monitor/setup.sh), i.e. 288 runs/day
# monthly x 12 keeps a year of history in ~12 rotated files. Compressed that is well under 5 MB, which is
# nothing against the 65 GB free on /, and a year is long enough that an incident can still be reconstructed
# from the log months later. Daily rotation was rejected: at 41 KB/day it would produce hundreds of tiny
# files and make grepping across an incident window harder, not easier.
#
# maxsize 32M is the guard for the case the estimate stops holding (a health.sh loop, a curl that suddenly
# prints on every run): logrotate then rotates early on its daily cron run instead of waiting for the month,
# so the worst case is bounded at roughly 32M x (12 + 1) even if the daily rate explodes.
/var/log/giinrecord-monitor.log {
    monthly
    maxsize 32M
    rotate 12
    missingok
    notifempty
    compress
    delaycompress
    # The live log is 600 root:root and may name internal hosts and container names; rotated copies keep that.
    # su root root (not the global `su root adm`) so the archives never become readable to the adm group,
    # which on this shared VPS would widen who can read them.
    su root root
    create 0600 root root
}
