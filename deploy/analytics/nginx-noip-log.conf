# /etc/nginx/conf.d/gikailog-noip-log.conf   (http{} context; installed by vps-analytics-setup.sh)
#
# Access-log format WITHOUT the client IP and WITHOUT the user agent.
# Kept: time, request line (method / path / protocol), status, bytes, referrer.
# The two leading "- -" keep the line shape close to "combined" so ordinary tools still parse it.
# The site's server block uses:  access_log /var/log/nginx/gikailog.access.log noip;
log_format noip '- - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "-"';
